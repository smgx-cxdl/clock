<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>怀表时钟</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="怀表">
<meta name="theme-color" content="#4a3a2a">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
    overflow: hidden; user-select: none; -webkit-user-select: none;
    font-family: "Songti SC", "Noto Serif SC", Georgia, "Times New Roman", serif;
  }
  svg { width: min(94vw, 58vh); height: auto; }
  .digital { margin-top: 2vh; text-align: center; color: #222; }
  @media (prefers-color-scheme: dark) { .digital { color: #f2f2f2; } }
  .time { font-size: clamp(38px, 12vw, 64px); letter-spacing: .04em; font-variant-numeric: tabular-nums; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif; font-weight: 300; line-height: 1; }
  .date { margin-top: 10px; font-size: clamp(15px, 4.4vw, 20px); letter-spacing: .08em; opacity: .9; font-variant-numeric: tabular-nums; font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif; white-space: pre; }
</style>
</head>
<body>
<svg viewBox="-196 -196 392 392" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/><stop offset=".25" stop-color="#b9bcc0"/>
      <stop offset=".5" stop-color="#f2f3f4"/><stop offset=".75" stop-color="#9a9da2"/>
      <stop offset="1" stop-color="#e8e9ea"/>
    </linearGradient>
    <linearGradient id="silver2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f5"/><stop offset=".5" stop-color="#a8abb0"/><stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
    <radialGradient id="face" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#efefee"/>
    </radialGradient>
    <filter id="hs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.8" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- 表壳 -->
  <circle r="190" fill="url(#silver)" stroke="#7d8085" stroke-width="1.5"/>
  <circle r="178" fill="url(#silver2)" stroke="#9a9da2" stroke-width="1"/>
  <circle r="164" fill="#c9cbce" stroke="#8c8f94" stroke-width="1.5"/>
  <circle r="158" fill="url(#face)" stroke="#666" stroke-width="1"/>

  <g id="marks"></g>

  <text x="0" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2" fill="#333">QUARTZ</text>

  <!-- 指针 -->
  <g id="hour" filter="url(#hs)"></g>
  <g id="min" filter="url(#hs)"></g>
  <g id="sec" filter="url(#hs)"></g>
  <circle r="8" fill="#111"/><circle r="2.5" fill="#777"/>
</svg>

<div class="digital">
  <div class="time" id="time">00:00:00</div>
  <div class="date" id="date"></div>
</div>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var marks = document.getElementById("marks");
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    (parent || marks).appendChild(e); return e;
  }
  var ROMAN = ["XII","I","II","III","IIII","V","VI","VII","VIII","IX","X","XI"];
  ROMAN[4] = "IV";

  // 分钟刻度
  for (var i = 0; i < 60; i++) {
    var a = i * 6 * Math.PI / 180, big = i % 5 === 0;
    var r1 = 150, r2 = big ? 142 : 145;
    el("line", {
      x1: Math.sin(a) * r1, y1: -Math.cos(a) * r1,
      x2: Math.sin(a) * r2, y2: -Math.cos(a) * r2,
      stroke: "#222", "stroke-width": big ? 1.6 : .7
    });
  }
  // 24 小时小数字 + 罗马数字
  for (var h = 0; h < 12; h++) {
    var ang = h * 30, rad = ang * Math.PI / 180;
    var rx = Math.sin(rad) * 124, ry = -Math.cos(rad) * 124;
    var r = el("text", {
      x: 0, y: 0, "text-anchor": "middle", "dominant-baseline": "central",
      "font-family": "'Times New Roman', Georgia, serif", "font-size": 19, "font-weight": 300,
      fill: "#111", transform: "translate(" + rx + "," + ry + ") rotate(" + ang + ")"
    });
    r.textContent = ROMAN[h];
  }

  // 花式指针(指向正上方,靠旋转)
  // 直棍型指针:黑色外框 + 夜光填充
  function batonHand(g, len, width, tail) {
    el("rect", { x: -width / 2, y: -len, width: width, height: len + tail, fill: "#111" }, g);
    var lw = width * 0.45, from = len * 0.2;
    el("rect", { x: -lw / 2, y: -len + 4, width: lw, height: len - from - 4, fill: "#d9f2b8", stroke: "#8fb86a", "stroke-width": .4 }, g);
  }
  var hourG = document.getElementById("hour"), minG = document.getElementById("min"), secG = document.getElementById("sec");
  batonHand(hourG, 85, 7, 14);
  batonHand(minG, 125, 5.5, 14);
  // 秒针:直棍,末端带夜光点
  el("rect", { x: -1, y: -140, width: 2, height: 175, fill: "#111" }, secG);
  el("rect", { x: -1.1, y: -140, width: 2.2, height: 22, fill: "#d9f2b8" }, secG);

  var WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  var lastDay = -1;

  function tick() {
    var d = new Date();
    var s = d.getSeconds(), m = d.getMinutes(), h = d.getHours() % 12;
    var sa = s * 6;
    var ma = m * 6 + s * 0.1;
    var ha = h * 30 + m * 0.5;
    secG.setAttribute("transform", "rotate(" + sa + ")");
    minG.setAttribute("transform", "rotate(" + ma + ")");
    hourG.setAttribute("transform", "rotate(" + ha + ")");
    document.getElementById("time").textContent = pad(d.getHours()) + ":" + pad(m) + ":" + pad(s);
    if (lastDay !== d.getDate()) {
      lastDay = d.getDate();
      document.getElementById("date").textContent =
        d.getFullYear() + "年" + pad(d.getMonth() + 1) + "月" + pad(d.getDate()) + "日  " + WEEK[d.getDay()];
    }
    setTimeout(tick, 1000 - d.getMilliseconds() + 5);
  }
  tick();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });

  // 尽量保持屏幕常亮(支持的浏览器)
  try {
    if (navigator.wakeLock) {
      var lock = function () { navigator.wakeLock.request("screen").catch(function(){}); };
      lock();
      document.addEventListener("visibilitychange", function () { if (!document.hidden) lock(); });
    }
  } catch (e) {}
})();
</script>
</body>
</html>
