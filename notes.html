<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>記事本</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#222;--mute:#8a8a84;--line:#e6e4dc;--acc:#2f6f5e}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--ink:#e8e6df;--mute:#8d8b83;--line:#33322f;--acc:#6fbfa8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px calc(40px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;flex-wrap:wrap;padding:6px 0 8px}
header h1{font-size:18px;margin:0 auto 0 0;white-space:nowrap}
#stat{flex:none;white-space:nowrap;font-size:12px;color:var(--mute);margin:2px 0 2px 6px}
#stat:empty{display:none}
header button{padding:5px 8px;font-size:13px;margin-top:2px;margin-bottom:2px}
#refresh{margin-left:10px}
#trash_btn{margin-left:6px}
#gear{margin-left:6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
textarea,input.f{width:100%;border:0;outline:0;resize:vertical;background:transparent;color:var(--ink);font:inherit}
textarea{min-height:84px}
input.f{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:4px 0 10px}
label{font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.on{border-color:var(--acc);color:var(--acc)}
button.off{color:var(--mute)}
.sp{flex:1}
input.search{width:100%;margin:12px 0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;outline:0}
.sw{position:relative;margin:12px 0}
.sw input.search{margin:0;padding-right:44px}
.sw .x{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--mute);font-size:18px;line-height:1;padding:8px 12px}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.note.pin{border-color:var(--acc)}
.txt{white-space:pre-wrap;word-break:break-word}
.txt a{color:var(--acc)}
.txt.clamp{max-height:9.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.imgs img{max-width:100%;max-height:260px;border-radius:8px;border:1px solid var(--line);min-height:40px;min-width:40px;background:var(--bg)}
.meta{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:8px;font-size:12px;color:var(--mute)}
.meta button{padding:2px 8px;font-size:12px}
.pic{display:flex;flex-direction:column;gap:4px;align-items:flex-start;max-width:100%}
.pic button{font-size:12px;padding:2px 8px}
.lb{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.lb img{max-width:100%;max-height:75vh;border-radius:6px}
.lb div{color:#bbb;font-size:12px}
.ed{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;box-sizing:border-box;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.ed.sub{z-index:11}
.ed .bar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;max-width:720px;width:100%;margin:0 auto 8px}
.ed .bar button{padding:5px 9px;font-size:13px;white-space:nowrap}
.ed .bar b{flex:1;font-size:16px}
.ed textarea{flex:1;width:100%;max-width:720px;margin:0 auto;min-height:0;resize:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;line-height:1.6}
.ed .scroll{flex:1;width:100%;max-width:720px;margin:0 auto;overflow-y:auto}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs span{font-size:12px;background:var(--bg);border-radius:6px;padding:2px 8px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:12;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast button{padding:3px 10px;font-size:13px;border-color:transparent;background:var(--acc);color:#fff}
.help{font-size:13px;color:var(--mute);line-height:1.7;margin:0 0 12px}
.help b{color:var(--ink)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📒 記事本</h1>
    <span id="stat"></span>
    <button id="refresh">重新整理</button>
    <button id="trash_btn">回收箱</button>
    <button id="gear">設置</button>
  </header>

  <!-- 设置面板 -->
  <div class="box hide" id="setup">
    <p class="help">
      笔记存在你自己的 GitHub <b>私有仓库</b>里，每台设备首次使用填一次即可。<br>
      1. 在 GitHub 新建一个<b>私有（Private）</b>仓库，比如叫 <b>my-notes</b>，勾选“Add a README”。<br>
      2. 头像 → Settings → Developer settings → Fine-grained tokens → 新建：只选这个仓库，权限 <b>Contents: Read and write</b>。<br>
      3. 把下面三项填好。Token 只保存在这台设备的浏览器里。
    </p>
    <label>GitHub 用户名</label><input class="f" id="c_owner" autocapitalize="off" autocomplete="off">
    <label>仓库名</label><input class="f" id="c_repo" autocapitalize="off" autocomplete="off" placeholder="my-notes">
    <label>Token</label><input class="f" id="c_token" type="password" autocomplete="off">
    <label>分支</label><input class="f" id="c_branch" autocapitalize="off" autocomplete="off" placeholder="main">
    <div class="row"><button id="c_clear">清除本机数据</button><span class="sp"></span><button id="c_cancel">取消</button><button class="pri" id="c_save">保存并连接</button></div>
  </div>

  <div id="main">
    <div class="box">
      <textarea id="inp" placeholder="记点什么…（可粘贴图片，Ctrl+Enter 保存）"></textarea>
      <div class="thumbs" id="thumbs"></div>
      <div class="row">
        <button id="attach">🖼 图片</button>
        <button id="stamp_tog" class="on">🕒 自动时间</button>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <span class="sp"></span>
        <button class="pri" id="add">保存</button>
      </div>
    </div>
    <div class="sw"><input class="search" id="q" placeholder="搜索…" enterkeyhint="search" autocomplete="off"><button class="x hide" id="qx" aria-label="清空搜索">✕</button></div>
    <div id="list"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
let cfg=jget('gh.cfg',null);
let notes=jget('gh.notes',{});
let pending=[];
let editing=null;
const persist=()=>localStorage.setItem('gh.notes',JSON.stringify(notes));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const status=t=>$('#stat').textContent=t;

/* ---------- base64 ---------- */
function bufB64(buf){
  const u=new Uint8Array(buf);let s='';
  for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
  return btoa(s);
}
const strB64=s=>bufB64(new TextEncoder().encode(s));
const b64Str=b=>{const bin=atob(b.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)};

/* ---------- GitHub API ---------- */
function gh(path,opt={}){
  const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
  return fetch(url,{
    method:opt.method||'GET',cache:'no-store',
    headers:{'Authorization':'Bearer '+cfg.token,'Accept':opt.accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
    body:opt.body?JSON.stringify(opt.body):undefined
  });
}
const ref=()=>'ref='+encodeURIComponent(cfg.branch||'main')+'&t='+Date.now();

async function pull(){
  const r=await gh('notes.json?'+ref());
  if(r.status===404)return{notes:{},sha:null};
  if(r.status===401||r.status===403)throw new Error('Token 无效或没有权限');
  if(!r.ok)throw new Error('读取失败 '+r.status);
  const j=await r.json();
  let text='{}';
  if(j.content)text=b64Str(j.content);
  else if(j.size>0){
    const r2=await gh('notes.json?'+ref(),{accept:'application/vnd.github.raw+json'});
    text=await r2.text();
  }
  return{notes:JSON.parse(text||'{}'),sha:j.sha};
}
async function put(data,sha){
  const body={message:'notes '+new Date().toISOString(),content:strB64(JSON.stringify(data)),branch:cfg.branch||'main'};
  if(sha)body.sha=sha;
  const r=await gh('notes.json',{method:'PUT',body});
  if(r.status===409||r.status===422)return'conflict';
  if(!r.ok)throw new Error('保存失败 '+r.status);
  return'ok';
}
function merge(remote,local){
  const out={...remote};
  for(const id in local){const l=local[id];if(!out[id]||l.updated>out[id].updated)out[id]=l}
  return out;
}

/* ---------- 同步（手动 + 每次修改后） ---------- */
let busy=false,again=false;
async function syncNow(){
  if(!cfg)return;
  if(busy){again=true;return}
  busy=true;status('同步中…');$('#stat').title='';
  try{
    for(let i=0;i<3;i++){
      const{notes:remote,sha}=await pull();
      const merged=merge(remote,notes);
      const needPush=Object.values(merged).some(n=>!remote[n.id]||remote[n.id].updated<n.updated);
      notes=merged;persist();render();
      if(!needPush)break;
      if(await put(merged,sha)==='ok')break;
    }
    const d=new Date(),p2=x=>String(x).padStart(2,'0');
    status('已同步 '+p2(d.getHours())+':'+p2(d.getMinutes()));
  }catch(e){status('⚠ 同步失败');$('#stat').title=(e.message||'网络错误')+'（已存本机）'}
  busy=false;
  if(again){again=false;syncNow()}
}
function touch(n){n.updated=Date.now();notes[n.id]=n;persist();render();syncNow()}
$('#refresh').onclick=syncNow;
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});

/* ---------- 图片：压缩后存进仓库 img/ ---------- */
const blobs=new Map(); // path -> objectURL
function compress(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const M=1600,k=Math.min(1,M/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(),'image/jpeg',0.82);
    };
    im.onerror=()=>rej();im.src=url;
  });
}
async function addImages(files){
  if(!cfg){alert('请先在“设置”里连接 GitHub');return}
  for(const f of files){
    try{
      status('上传图片…');
      const blob=await compress(f);
      const path='img/'+uid()+'.jpg';
      const r=await gh(path,{method:'PUT',body:{message:'img',content:bufB64(await blob.arrayBuffer()),branch:cfg.branch||'main'}});
      if(!r.ok)throw 0;
      blobs.set(path,URL.createObjectURL(blob));
      pending.push({file:path,name:f.name||'image'});
    }catch(e){alert('图片上传失败：'+(f.name||'图片'))}
  }
  status('');renderThumbs();
}
async function imgUrl(path){
  if(blobs.has(path))return blobs.get(path);
  const r=await gh(path+'?'+ref(),{accept:'application/vnd.github.raw+json'});
  if(!r.ok)throw 0;
  const u=URL.createObjectURL(await r.blob());blobs.set(path,u);return u;
}
async function savePic(f){
  try{
    const u=await imgUrl(f.file);
    const a=document.createElement('a');a.href=u;a.download=f.file.split('/').pop();
    document.body.append(a);a.click();a.remove();
  }catch(e){alert('保存失败，请稍后再试')}
}
function openBox(u,f){
  const o=document.createElement('div');o.className='lb';
  const im=document.createElement('img');im.src=u;
  const tip=document.createElement('div');tip.textContent='长按图片也可保存 · 点空白处关闭';
  const b=btn('💾 保存到手机',e=>{e.stopPropagation();savePic(f)});
  o.append(im,b,tip);o.onclick=()=>o.remove();document.body.append(o);
}
try{history.scrollRestoration='manual'}catch(e){}

/* ---------- 提示条（5秒撤回误删） ---------- */
let toastEl=null,toastTimer=null;
function showToast(msg,label,fn){
  if(toastEl){toastEl.remove();toastEl=null}
  clearTimeout(toastTimer);
  const d=document.createElement('div');d.className='toast';
  const s=document.createElement('span');s.textContent=msg;
  const b=btn(label,()=>{d.remove();toastEl=null;clearTimeout(toastTimer);fn()});
  d.append(s,b);document.body.append(d);toastEl=d;
  toastTimer=setTimeout(()=>{d.remove();toastEl=null},5000);
}

/* ---------- 给新加的行自动补时间：〔2026年11月23日 12:01〕 ---------- */
const stampRe=/〔[^〕]*〕\s*$/;
function stampNow(){const d=new Date(),p=x=>String(x).padStart(2,'0');return '〔'+d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+p(d.getHours())+':'+p(d.getMinutes())+'〕'}
function watchMultiPaste(ta){
  const skip=new Map();
  ta.addEventListener('paste',e=>{
    const txt=(e.clipboardData?.getData('text/plain')||'').replace(/\r\n?/g,'\n');
    const lines=txt.split('\n');
    if(lines.filter(l=>l.trim()).length<=1)return; // 单行粘贴按原逻辑走
    const s=ta.selectionStart,val=ta.value;
    const before=val.slice(val.lastIndexOf('\n',s-1)+1,s);
    let last=-1;for(let i=lines.length-1;i>=0;i--)if(lines[i].trim()){last=i;break}
    for(let i=0;i<last;i++){
      const full=i===0?before+lines[0]:lines[i];
      if(full.trim())skip.set(full,(skip.get(full)||0)+1);
    }
  });
  return skip;
}
function stampNew(oldText,newText,skip){
  const cnt=new Map();for(const l of oldText.split('\n'))cnt.set(l,(cnt.get(l)||0)+1);
  const arr=newText.split('\n');
  const keep=arr.map(l=>{
    if(cnt.get(l)>0){cnt.set(l,cnt.get(l)-1);return true}   // 原来就有的行，不动
    return false;
  });
  // 原文里原本带时间、但被你主动删掉时间的那几行，保存时不再重新补回
  const hadStamp=new Map();
  cnt.forEach((n,l)=>{
    if(n>0&&stampRe.test(l)){
      const c=l.replace(stampRe,'').replace(/\s+$/,'');
      hadStamp.set(c,(hadStamp.get(c)||0)+n);
    }
  });
  const st=stampNow();
  return arr.map((l,i)=>{
    if(keep[i]||!l.trim()||stampRe.test(l))return l;         // 原行、空行、或已带时间的行，不动
    if(skip&&skip.get(l)>0){skip.set(l,skip.get(l)-1);return l} // 一次粘贴多行里非最后一行，不加时间
    const clean=l.replace(/\s+$/,'');
    if(hadStamp.get(clean)>0){hadStamp.set(clean,hadStamp.get(clean)-1);return l} // 主动删掉时间的行，不补回
    return clean+' '+st;
  }).join('\n');
}
function stripCursorStamps(ta){
  const val=ta.value,a=ta.selectionStart,b=ta.selectionEnd;
  const start=val.lastIndexOf('\n',a-1)+1;
  let end=val.indexOf('\n',b);if(end<0)end=val.length;
  if(b>a&&val[b-1]==='\n')end=b-1;
  const part=val.slice(start,end).split('\n').map(l=>l.replace(/\s*〔[^〕]*〕\s*$/,'')).join('\n');
  ta.value=val.slice(0,start)+part+val.slice(end);
  ta.focus({preventScroll:true});
  ta.setSelectionRange(start+part.length,start+part.length);
}
function makeStampTog(b,short,onChange){
  let on=true;
  const sync=()=>{b.textContent=on?(short?'🕒 自动':'🕒 自动时间'):(short?'🕒 关':'🕒 不加时间');b.className=on?'on':'off'};
  b.onclick=()=>{on=!on;sync();onChange&&onChange(on)};
  sync();
  return{get:()=>on,reset:()=>{on=true;sync()}};
}

/* ---------- 历史版本恢复 ---------- */
function openHistory(n,ta,base){
  const o=document.createElement('div');o.className='ed sub';
  const bar=document.createElement('div');bar.className='bar';
  const title=document.createElement('b');title.textContent='历史版本';
  const back=btn('关闭',()=>o.remove());
  bar.append(back,title);
  const sc=document.createElement('div');sc.className='scroll';
  const items=[];
  if(ta.value!==base)items.push({label:'编辑前原稿（打开此页时的内容）',text:base});
  for(const h of (n.hist||[]))items.push({label:fmt(h.t)+' 保存前',text:h.text});
  if(!items.length){
    sc.innerHTML='<div class="empty">暂无历史版本<br><small>每次修改保存后，会自动保留最近 5 个旧版本</small></div>';
  }else{
    for(const it of items){
      const c=document.createElement('div');c.className='note';
      const t=document.createElement('div');t.className='txt';t.textContent=it.text||'(空)';
      const m=document.createElement('div');m.className='meta';
      const tm=document.createElement('span');tm.textContent=it.label;
      const sp=document.createElement('span');sp.className='sp';
      const use=btn('恢复到此版本',()=>{
        ta.value=it.text;o.remove();
        setTimeout(()=>{ta.focus({preventScroll:true});ta.setSelectionRange(ta.value.length,ta.value.length)},30);
      });
      use.className='pri';
      m.append(tm,sp,use);c.append(t,m);sc.append(c);
    }
  }
  o.append(bar,sc);document.body.append(o);
}

/* ---------- 回收站（恢复误删笔记 + 一键清空） ---------- */
function openTrash(){
  const o=document.createElement('div');o.className='ed sub';
  const bar=document.createElement('div');bar.className='bar';
  const title=document.createElement('b');title.textContent='回收站';
  const closeBtn=btn('关闭',()=>o.remove());
  const emptyBtn=btn('一键清空',()=>{
    const list=Object.values(notes).filter(n=>n.deleted&&!n.purged);
    if(!list.length)return;
    if(!confirm('确定彻底清空回收站里的 '+list.length+' 条笔记？清空后无法恢复！'))return;
    const now=Date.now();
    for(const n of list)notes[n.id]={id:n.id,deleted:true,purged:true,updated:now};
    persist();render();syncNow();draw();
  });
  const sc=document.createElement('div');sc.className='scroll';
  const draw=()=>{
    sc.innerHTML='';
    const list=Object.values(notes).filter(n=>n.deleted&&!n.purged).sort((a,b)=>(b.updated||0)-(a.updated||0));
    title.textContent=list.length?'回收站 ('+list.length+')':'回收站';
    emptyBtn.classList.toggle('hide',!list.length);
    if(!list.length){sc.innerHTML='<div class="empty">回收站是空的</div>';return}
    for(const n of list){
      const c=document.createElement('div');c.className='note';
      const t=document.createElement('div');t.className='txt';t.textContent=n.text||(n.files?.length?'[图片笔记]':'(空)');
      const m=document.createElement('div');m.className='meta';
      const tm=document.createElement('span');tm.textContent='删除于 '+fmt(n.updated||n.created);
      const sp=document.createElement('span');sp.className='sp';
      const restore=btn('恢复',()=>{n.deleted=false;touch(n);draw()});
      restore.className='pri';
      const purge=btn('彻底删除',()=>{
        if(confirm('彻底删除后将无法在回收站恢复，确定？')){
          notes[n.id]={id:n.id,deleted:true,purged:true,updated:Date.now()};
          persist();render();syncNow();draw();
        }
      });
      m.append(tm,sp,purge,restore);c.append(t,m);sc.append(c);
    }
  };
  bar.append(closeBtn,title,emptyBtn);o.append(bar,sc);document.body.append(o);
  draw();
}
$('#trash_btn').onclick=openTrash;

let editorOpen=null;
addEventListener('popstate',()=>{if(editorOpen){editorOpen.save();editorOpen.close(true)}}); // 返回键 = 自动保存并退出
function openEditor(n){
  const o=document.createElement('div');o.className='ed';
  const ta=document.createElement('textarea');ta.value=n.text||'';
  const vv=window.visualViewport;
  const fit=()=>{o.style.height=(vv?vv.height:innerHeight)+'px';o.style.top=(vv?vv.offsetTop:0)+'px'};
  const oldOverflow=document.body.style.overflow;
  const base=n.text||'';                  // 打开编辑时的原文，用它来判断哪些行是新加的
  const edSkip=watchMultiPaste(ta);
  let autoStamp=true;
  const save=()=>{
    const v=autoStamp?stampNew(base,ta.value,edSkip):ta.value;
    let changed=v!==(n.text||'');
    if(base&&v!==base){
      const h=Array.isArray(n.hist)?n.hist.slice():[];
      if(!h.length||h[0].text!==base){
        h.unshift({t:Date.now(),text:base});
        if(h.length>5)h.length=5;
        n.hist=h;changed=true;
      }
    }
    if(changed){n.text=v;touch(n)}
  };
  const draft=()=>{if(ta.value!==(n.text||'')){n.text=ta.value;touch(n)}};                    // 切到别的 App：只存草稿，不加时间
  // 关闭编辑页；back=true 表示由手机返回键触发（历史记录已经退了一格）
  const close=(byBack)=>{
    if(!editorOpen)return;editorOpen=null;
    if(vv){vv.removeEventListener('resize',fit);vv.removeEventListener('scroll',fit)}
    document.removeEventListener('visibilitychange',onHide);
    document.body.style.overflow=oldOverflow;o.remove();
    if(!byBack&&history.state&&history.state.ed)history.back();
  };
  const onHide=()=>{if(document.hidden)draft()}; // 切到别的 App 也自动保存
  const bar=document.createElement('div');bar.className='bar';
  const sp=document.createElement('span');sp.className='sp';
  const togBtn=document.createElement('button');
  makeStampTog(togBtn,true,v=>{autoStamp=v});
  const stripBtn=btn('去时间',()=>stripCursorStamps(ta));
  const histBtn=btn('历史',()=>openHistory(n,ta,base));
  const cancel=btn('取消',()=>{
    if(ta.value!==base&&!confirm('放弃修改？'))return;
    if((n.text||'')!==base){n.text=base;touch(n)}   // 若之前已存过草稿，恢复原文
    close();
  });
  const ok=btn('保存',()=>{save();close()});
  ok.className='pri';
  editorOpen={save,close};
  history.pushState({ed:1},'');           // 让手机返回键先退出编辑页，而不是退出网页
  document.addEventListener('visibilitychange',onHide);
  bar.append(cancel,togBtn,stripBtn,histBtn,sp,ok);o.append(bar,ta);document.body.append(o);
  document.body.style.overflow='hidden';fit();
  if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit)}
  setTimeout(()=>{ta.focus({preventScroll:true});ta.setSelectionRange(ta.value.length,ta.value.length)},60);
}
function renderThumbs(){
  $('#thumbs').innerHTML='';
  pending.forEach((a,i)=>{const s=document.createElement('span');s.textContent='🖼 '+a.name+' ✕';s.onclick=()=>{pending.splice(i,1);renderThumbs()};$('#thumbs').append(s)});
}
const inpSkip=watchMultiPaste($('#inp'));
const inpStamp=makeStampTog($('#stamp_tog'),false);
$('#attach').onclick=()=>$('#file').click();
$('#file').onchange=e=>{addImages([...e.target.files]);e.target.value=''};
$('#inp').addEventListener('paste',e=>{
  const fs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));
  if(fs.length){e.preventDefault();addImages(fs)}
});
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))add()});

/* ---------- 增删改 ---------- */
function add(){
  const raw=$('#inp').value.trim();
  const text=inpStamp.get()?stampNew('',raw,inpSkip):raw;
  inpSkip.clear();inpStamp.reset();
  if(!text&&!pending.length)return;
  touch({id:uid(),text,files:pending,pinned:false,deleted:false,created:Date.now()});
  $('#inp').value='';pending=[];renderThumbs();
}
$('#add').onclick=add;
const qBox=$('#q'),qX=$('#qx');
qBox.oninput=()=>{qX.classList.toggle('hide',!qBox.value);render()};
qX.onclick=()=>{qBox.value='';qX.classList.add('hide');render()};            // ✕ 一键清空搜索
qBox.addEventListener('keydown',e=>{if(e.key==='Escape')qX.click()});

/* ---------- 渲染 ---------- */
const fmt=t=>{const d=new Date(t);return (d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function linkify(el,text){
  const re=/(https?:\/\/[^\s<>"]+)/g;let last=0,m;
  while((m=re.exec(text))){
    el.append(text.slice(last,m.index));
    const a=document.createElement('a');a.href=m[1];a.textContent=m[1];a.target='_blank';a.rel='noopener';el.append(a);
    last=m.index+m[1].length;
  }
  el.append(text.slice(last));
}
const openSet=new Set(); // 已展开的笔记 id（刷新同步后保持）
function btn(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;return b}

function render(){
  const y=window.scrollY; // 重绘列表会让页面瞬间变短导致跳回顶部，先记住位置，画完再恢复
  const q=$('#q').value.trim().toLowerCase();
  const list=Object.values(notes).filter(n=>!n.deleted&&(!q||(n.text||'').toLowerCase().includes(q)))
    .sort((a,b)=>(b.pinned-a.pinned)||(b.created-a.created));
  const box=$('#list');box.innerHTML='';
  if(!list.length){
    box.innerHTML='<div class="empty">'+(q?'没有找到':'还没有记录')+'</div>';
  }else{
    for(const n of list){
      const c=document.createElement('div');c.className='note'+(n.pinned?' pin':'');
      if(editing===n.id){
        const ta=document.createElement('textarea');ta.value=n.text||'';ta.style.minHeight='100px';
        const row=document.createElement('div');row.className='row';
        row.append(btn('取消',()=>{editing=null;render()}),
          Object.assign(btn('保存',()=>{editing=null;n.text=ta.value;touch(n)}),{className:'pri'}));
        c.append(ta,row);box.append(c);setTimeout(()=>ta.focus(),0);continue;
      }
      const t=document.createElement('div');t.className='txt clamp';linkify(t,n.text||'');c.append(t);
      if(n.files?.length){
        const g=document.createElement('div');g.className='imgs';
        for(const f of n.files){
          const w=document.createElement('div');w.className='pic';
          const im=document.createElement('img');im.loading='lazy';
          w.append(im,btn('💾 保存到手机',()=>savePic(f)));g.append(w);
          imgUrl(f.file).then(u=>{im.src=u;im.onclick=()=>openBox(u,f)}).catch(()=>{im.alt='图片加载失败'});
        }
        c.append(g);
      }
      const m=document.createElement('div');m.className='meta';
      const tm=document.createElement('span');tm.textContent=(n.pinned?'📌 ':'')+fmt(n.created);
      const sp=document.createElement('span');sp.style.flex='1';
      m.append(tm,sp,
        btn('复制',()=>navigator.clipboard?.writeText(n.text||'')),
        btn(n.pinned?'取消置顶':'置顶',()=>{n.pinned=!n.pinned;touch(n)}),
        btn('编辑',()=>openEditor(n)),
        btn('删除',()=>{if(confirm('删除这条？')){n.deleted=true;touch(n);showToast('已移入回收站','撤销',()=>{n.deleted=false;touch(n)})}}));
      c.append(m);box.append(c);
      // 折叠：内容超出 6 行才出现展开/收起按钮
      if(t.scrollHeight>t.clientHeight+2){
        const open=openSet.has(n.id);if(open)t.classList.remove('clamp');
        const tg=btn(open?'收起':'展开',()=>{
          const o=t.classList.toggle('clamp');
          o?openSet.delete(n.id):openSet.add(n.id);
          tg.textContent=o?'展开':'收起';
        });
        m.insertBefore(tg,sp.nextSibling);
      }else t.classList.remove('clamp');
    }
  }
  window.scrollTo(0,y);
}

/* ---------- 设置 ---------- */
function showSetup(on){
  $('#setup').classList.toggle('hide',!on);
  $('#main').classList.toggle('hide',on);
  if(on){
    $('#c_owner').value=cfg?.owner||'';$('#c_repo').value=cfg?.repo||'';
    $('#c_token').value=cfg?.token||'';$('#c_branch').value=cfg?.branch||'main';
  }
}
$('#gear').onclick=()=>showSetup(true);
$('#c_cancel').onclick=()=>showSetup(!cfg);
$('#c_clear').onclick=()=>{
  if(confirm('清除本机保存的设置和笔记缓存？（仓库里的笔记不受影响）')){
    localStorage.removeItem('gh.cfg');localStorage.removeItem('gh.notes');cfg=null;notes={};render();showSetup(true);
  }
};
$('#c_save').onclick=async()=>{
  const c={owner:$('#c_owner').value.trim(),repo:$('#c_repo').value.trim(),token:$('#c_token').value.trim(),branch:$('#c_branch').value.trim()||'main'};
  if(!c.owner||!c.repo||!c.token){alert('请填完整');return}
  const old=cfg;cfg=c;
  try{await pull()}catch(e){cfg=old;alert('连接失败：'+(e.message||'网络错误')+'\n请检查用户名、仓库名、Token 权限；国内网络不稳定时可重试。');return}
  localStorage.setItem('gh.cfg',JSON.stringify(c));
  showSetup(false);syncNow();
};

render();
if(cfg)syncNow();else showSetup(true);
</script>
</body>
</html>
